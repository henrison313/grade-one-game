<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>炫卡闯关游戏 - 小红书封面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple-start: #667eea;
      --purple-end: #764ba2;
      --orange-accent: #ff6b35;
      --orange-light: #ffb347;
      --yellow-star: #ffd93d;
      --white: #ffffff;
      --pink-accent: #ff6b9d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
      padding: 20px;
    }

    .cover {
      width: 450px;
      height: 600px;
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      box-shadow:
        0 25px 50px rgba(102, 126, 234, 0.4),
        0 0 100px rgba(118, 75, 162, 0.3);
    }

    /* 背景渐变 */
    .bg-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--purple-start) 0%, var(--purple-end) 100%);
    }

    /* 网格纹理 */
    .grid-pattern {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    /* 光晕效果 */
    .glow-1 {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(255, 107, 53, 0.3) 0%, transparent 70%);
      top: -50px;
      right: -50px;
      animation: pulse 4s ease-in-out infinite;
    }

    .glow-2 {
      position: absolute;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(255, 217, 61, 0.25) 0%, transparent 70%);
      bottom: 100px;
      left: -50px;
      animation: pulse 3s ease-in-out infinite 1s;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
    }

    /* 装饰星星 */
    .star {
      position: absolute;
      font-size: 24px;
      animation: twinkle 2s ease-in-out infinite;
      filter: drop-shadow(0 0 8px var(--yellow-star));
    }

    .star:nth-child(1) { top: 60px; left: 30px; animation-delay: 0s; }
    .star:nth-child(2) { top: 120px; right: 40px; animation-delay: 0.3s; font-size: 32px; }
    .star:nth-child(3) { top: 200px; left: 50px; animation-delay: 0.6s; font-size: 20px; }
    .star:nth-child(4) { bottom: 180px; right: 30px; animation-delay: 0.9s; }
    .star:nth-child(5) { bottom: 250px; left: 20px; animation-delay: 1.2s; font-size: 28px; }

    @keyframes twinkle {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
      50% { transform: scale(1.2) rotate(15deg); opacity: 0.7; }
    }

    /* 数字装饰 */
    .number {
      position: absolute;
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.15);
      font-size: 80px;
      line-height: 1;
    }

    .number:nth-child(1) { top: 80px; right: 20px; }
    .number:nth-child(2) { bottom: 160px; left: -10px; font-size: 100px; }
    .number:nth-child(3) { top: 200px; left: 60%; font-size: 60px; }

    /* 卡牌元素 */
    .cards-container {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: -15px;
    }

    .card {
      width: 70px;
      height: 95px;
      border-radius: 12px;
      background: linear-gradient(145deg, #fff 0%, #f0f0f0 100%);
      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: float 3s ease-in-out infinite;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 3px;
      border-radius: 10px;
      border: 2px solid rgba(102, 126, 234, 0.3);
    }

    .card:nth-child(1) {
      transform: rotate(-12deg) translateY(10px);
      background: linear-gradient(145deg, #fff5e6 0%, #ffe4cc 100%);
      animation-delay: 0s;
    }

    .card:nth-child(2) {
      transform: rotate(0deg) translateY(-5px);
      z-index: 2;
      animation-delay: 0.3s;
    }

    .card:nth-child(3) {
      transform: rotate(12deg) translateY(10px);
      background: linear-gradient(145deg, #ffe6f0 0%, #ffccd9 100%);
      animation-delay: 0.6s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(var(--rotate, 0deg)); }
      50% { transform: translateY(-8px) rotate(var(--rotate, 0deg)); }
    }

    .card:nth-child(1) { --rotate: -12deg; }
    .card:nth-child(2) { --rotate: 0deg; }
    .card:nth-child(3) { --rotate: 12deg; }

    .card-image {
      width: 55px;
      height: 55px;
      object-fit: contain;
      margin-bottom: 4px;
    }

    .card-stars {
      font-size: 10px;
      color: var(--yellow-star);
      text-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    /* 主标题区 */
    .title-area {
      position: absolute;
      top: 100px;
      left: 0;
      right: 0;
      text-align: center;
      padding: 0 20px;
    }

    .main-title {
      font-family: 'ZCOOL KuaiLe', cursive;
      font-size: 42px;
      color: var(--white);
      text-shadow:
        0 4px 0 rgba(0, 0, 0, 0.2),
        0 8px 20px rgba(0, 0, 0, 0.3);
      line-height: 1.3;
      margin-bottom: 16px;
    }

    .main-title .highlight {
      color: var(--orange-light);
      position: relative;
      display: inline-block;
    }

    .main-title .highlight::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 8px;
      background: var(--orange-accent);
      border-radius: 4px;
      opacity: 0.5;
      z-index: -1;
    }

    .subtitle {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.15);
      padding: 8px 20px;
      border-radius: 30px;
      display: inline-block;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .subtitle .multiply {
      color: var(--orange-light);
      margin: 0 6px;
    }

    /* 中间角色区域 */
    .character-area {
      position: absolute;
      top: 58%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .character-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(145deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.05) 100%);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.2),
        inset 0 0 30px rgba(255, 255, 255, 0.1);
      animation: characterFloat 4s ease-in-out infinite;
      overflow: hidden;
    }

    @keyframes characterFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .character-image {
      width: 60px;
      height: 60px;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
    }

    .progress-bar {
      width: 200px;
      height: 16px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
      overflow: hidden;
      margin: 0 auto;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .progress-fill {
      width: 75%;
      height: 100%;
      background: linear-gradient(90deg, var(--yellow-star) 0%, var(--orange-light) 100%);
      border-radius: 8px;
      animation: progressPulse 2s ease-in-out infinite;
    }

    @keyframes progressPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }

    .progress-text {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
      margin-top: 12px;
    }

    /* 数学符号装饰 */
    .math-symbols {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .math-symbol {
      position: absolute;
      font-size: 28px;
      color: rgba(255, 255, 255, 0.2);
      font-weight: 900;
      animation: floatSlow 6s ease-in-out infinite;
    }

    .math-symbol:nth-child(1) { top: 150px; left: 10%; animation-delay: 0s; }
    .math-symbol:nth-child(2) { top: 280px; right: 15%; animation-delay: 1s; }
    .math-symbol:nth-child(3) { bottom: 220px; left: 15%; animation-delay: 2s; }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(10deg); }
    }

    /* 底部标签 */
    .bottom-tags {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .tag {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 700;
    }

    .tag-orange {
      background: var(--orange-accent);
      color: white;
    }

    .tag-purple {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    /* 角落装饰 */
    .corner-decor {
      position: absolute;
      width: 80px;
      height: 80px;
    }

    .corner-decor.top-left {
      top: 0;
      left: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%);
    }

    .corner-decor.bottom-right {
      bottom: 0;
      right: 0;
      background: linear-gradient(-45deg, rgba(255,255,255,0.1) 0%, transparent 50%);
    }
  </style>
</head>
<body>
  <div class="cover">
    <!-- 背景层 -->
    <div class="bg-gradient"></div>
    <div class="grid-pattern"></div>
    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <!-- 角落装饰 -->
    <div class="corner-decor top-left"></div>
    <div class="corner-decor bottom-right"></div>

    <!-- 背景数字 -->
    <div class="number">1</div>
    <div class="number">+5</div>
    <div class="number">7</div>

    <!-- 数学符号 -->
    <div class="math-symbols">
      <span class="math-symbol">+</span>
      <span class="math-symbol">−</span>
      <span class="math-symbol">=</span>
    </div>

    <!-- 星星装饰 -->
    <span class="star">⭐</span>
    <span class="star">⭐</span>
    <span class="star">⭐</span>
    <span class="star">⭐</span>
    <span class="star">⭐</span>

    <!-- 主标题 -->
    <div class="title-area">
      <h1 class="main-title">
        给娃做的<span class="highlight">数学游戏</span><br>
        玩到停不下来！
      </h1>
      <div class="subtitle">
        一年级数学<span class="multiply">×</span>炫卡斗士
      </div>
    </div>

    <!-- 角色区域 -->
    <div class="character-area">
      <div class="character-circle">
        <img src="xiaojun.png" alt="小俊" class="character-image">
      </div>
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
      <div class="progress-text">⭐ 75 颗星星收集进度</div>
    </div>

    <!-- 卡牌展示 -->
    <div class="cards-container">
      <div class="card">
        <img src="card1.png" alt="炫蓝闪电" class="card-image">
        <span class="card-stars">⭐⭐⭐</span>
      </div>
      <div class="card">
        <img src="card2.png" alt="霹雳火影" class="card-image">
        <span class="card-stars">⭐⭐⭐⭐</span>
      </div>
      <div class="card">
        <img src="card3.png" alt="暗影特工" class="card-image">
        <span class="card-stars">⭐⭐⭐</span>
      </div>
    </div>

    <!-- 底部标签 -->
    <div class="bottom-tags">
      <span class="tag tag-orange">一年级</span>
      <span class="tag tag-purple">人教版</span>
      <span class="tag tag-purple">离线可玩</span>
    </div>
  </div>
</body>
</html>
